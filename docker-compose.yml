version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-pricing-postgres
    environment:
      POSTGRES_DB: smart_pricing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-pricing-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smart-pricing-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smart-pricing-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: smart-pricing-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - smart-pricing-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: smart-pricing-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - smart-pricing-network
    restart: unless-stopped

  # pgAdmin (Database Management UI) - Optional
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart-pricing-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartpricing.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - smart-pricing-network
    restart: unless-stopped

  # Price Updater Worker
  price-updater:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: smart-pricing-price-updater
    command: python -m src.workers price_updater --interval 300 --lookback-days 30
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_pricing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-pricing-network
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:rw

  # Data Collector Worker
  data-collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: smart-pricing-data-collector
    command: python -m src.workers data_collector --interval 3600
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_pricing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-pricing-network
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro

  # Model Retrainer Worker
  model-retrainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: smart-pricing-model-retrainer
    command: python -m src.workers model_retrainer --interval 604800 --min-samples 100 --improvement-threshold 0.05
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_pricing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-pricing-network
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:rw

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  smart-pricing-network:
    driver: bridge
