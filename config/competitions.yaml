# Configuración de Competiciones
# Definición de todas las competiciones y sus características

# ============================================================================
# COMPETICIONES NACIONALES
# ============================================================================
national_competitions:
  - id: "LALIGA"
    name: "LaLiga EA Sports"
    short_name: "LaLiga"
    type: "league"
    country: "España"
    level: 1
    base_multiplier: 1.0
    season: "2024-2025"
    total_matches: 38
    importance: "high"
    features:
      rivalries_matter: true
      position_matters: true
      relegation_battle: true
    description: "Primera División española"

  - id: "COPA_REY"
    name: "Copa de S.M. el Rey"
    short_name: "Copa del Rey"
    type: "knockout"
    country: "España"
    level: 1
    base_multiplier: 1.2
    season: "2024-2025"
    importance: "high"
    stages:
      - name: "Dieciseisavos"
        multiplier: 0.9
      - name: "Octavos de Final"
        multiplier: 1.2
      - name: "Cuartos de Final"
        multiplier: 1.5
      - name: "Semifinales"
        multiplier: 2.0
      - name: "Final"
        multiplier: 3.0
    features:
      stage_based_pricing: true
      single_match_elimination: true
    description: "Copa del Rey - Torneo de eliminación directa"

  - id: "SUPERCOPA"
    name: "Supercopa de España"
    short_name: "Supercopa"
    type: "super_cup"
    country: "España"
    level: 1
    base_multiplier: 2.0
    season: "2024-2025"
    importance: "high"
    features:
      limited_participation: true
      prestigious: true
    description: "Supercopa de España"

