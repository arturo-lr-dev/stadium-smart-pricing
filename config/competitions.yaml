# ============================================================================
# CONFIGURACIÓN DE CARACTERÍSTICAS
# ============================================================================
features_impact:
  # Impacto de características en el pricing
  rivalries_matter:
    description: "Los derbies y rivalidades afectan el precio"
    impact: "high"
    multiplier_range: [1.5, 2.5]

  position_matters:
    description: "La posición en tabla afecta el precio"
    impact: "medium"
    multiplier_range: [0.9, 1.3]

  relegation_battle:
    description: "Partidos de descenso tienen ajuste especial"
    impact: "high"
    multiplier_range: [1.3, 1.8]

  stage_based_pricing:
    description: "El precio varía según la fase de la competición"
    impact: "very_high"
    multiplier_range: [1.0, 5.0]

  international:
    description: "Partidos internacionales tienen interés especial"
    impact: "high"
    multiplier_range: [1.2, 2.0]

  highest_prestige:
    description: "Máximo prestigio de la competición"
    impact: "very_high"
    multiplier_range: [2.5, 5.0]

# ============================================================================
# REGLAS ESPECIALES POR COMPETICIÓN
# ============================================================================
special_rules:
  LALIGA:
    # Jornadas especiales
    special_matchdays:
      - matchday: 1
        name: "Jornada inaugural"
        multiplier: 1.3
      - matchday: 38
        name: "Última jornada"
        multiplier: 1.2

    # Partidos según posición
    position_based:
      top3_rival: 2.5      # vs top 3
      top10_rival: 1.5     # vs top 10
      mid_table: 1.0       # vs mitad de tabla
      bottom3_rival: 0.85  # vs 3 últimos

  COPA_REY:
    # Bono por eliminación directa
    elimination_bonus: 1.2

    # Ajuste por rival de categoría inferior
    lower_division_penalty: 0.75

  UCL:
    # Grupos de muerte (grupos difíciles)
    tough_group_bonus: 1.2

    # Partidos decisivos
    decisive_match_bonus: 1.5

# ============================================================================
# CALENDARIO Y TIMING
# ============================================================================
timing_preferences:
  preferred_slots:
    LALIGA:
      - day: "saturday"
        time: "21:00"
        multiplier: 1.15
      - day: "sunday"
        time: "18:30"
        multiplier: 1.10

    COPA_REY:
      - day: "wednesday"
        time: "21:00"
        multiplier: 1.0

    UCL:
      - day: "tuesday"
        time: "21:00"
        multiplier: 1.2
      - day: "wednesday"
        time: "21:00"
        multiplier: 1.2

    UEL:
      - day: "thursday"
        time: "21:00"
        multiplier: 1.1

# ============================================================================
# METADATOS
# ============================================================================
metadata:
  version: "1.0"
  last_updated: "2024-12-12"
  season: "2024-2025"
  total_competitions: 12
  notes: "Configuración de competiciones para la temporada 2024-2025"
